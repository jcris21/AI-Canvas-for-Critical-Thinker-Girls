<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WonderCanvas AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              /* Legacy brand palette (canvas session) */
              brand: {
                50: '#fdf2f8', 100: '#fce7f3', 200: '#fbcfe8',
                300: '#f9a8d4', 400: '#f472b6', 500: '#ec4899', 600: '#db2777',
              },
              canvas: '#ffffff',
              /* WonderCanvas Design System — MD3-inspired tokens */
              primary:                  '#9720ab',
              'primary-container':      '#f3e8ff',
              'on-primary':             '#ffffff',
              'on-primary-container':   '#3b0068',
              secondary:                '#006666',
              'secondary-container':    '#e0f5ee',
              'secondary-dim':          '#004d4d',
              'on-secondary':           '#ffffff',
              'on-secondary-container': '#003232',
              tertiary:                 '#006b5c',
              'tertiary-container':     '#7fd4c3',
              'tertiary-fixed-dim':     '#7fd4c3',
              'on-tertiary':            '#ffffff',
              'on-tertiary-fixed':      '#002019',
              /* Surfaces */
              'surface':                   '#fdf2f8',
              'surface-variant':           '#eae7ea',
              'surface-dim':               '#d8d3d8',
              'surface-container-lowest':  '#ffffff',
              'surface-container':         '#f5f0f5',
              'surface-container-high':    '#ede8ed',
              'surface-container-highest': '#e5e0e5',
              /* Text on surfaces */
              'on-surface':         '#1d1b20',
              'on-surface-variant': '#4a444c',
              /* Borders */
              'outline':         '#79747e',
              'outline-variant': '#cac4cf',
              /* Error */
              'error':           '#B3261E',
              'error-container': '#F9DEDC',
              'on-error':        '#ffffff',
            },
            fontFamily: {
              sans:     ['Plus Jakarta Sans', 'Comic Sans MS', 'cursive', 'sans-serif'],
              headline: ['Plus Jakarta Sans', 'sans-serif'],
              label:    ['Plus Jakarta Sans', 'sans-serif'],
            },
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #fdf2f8;
        overscroll-behavior: none;
        font-family: 'Plus Jakarta Sans', sans-serif;
      }
      /* Full-height flex layout for screens */
      .stitch-screen {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background-color: #fdf2f8;
      }
      /* Hide scrollbar */
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      /* Vial progress fill */
      .vial-fill { background: linear-gradient(90deg, #9720ab, #ea73fb); }
    </style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
